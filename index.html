<script>
/* показ помилок — щоб можна було надіслати Claude скріншот */
window.__errs = [];
window.addEventListener('error', function (e) {
  var m = (e.message || 'error') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ':' + (e.colno || '');
  window.__errs.push(m);
  try { var d = document.createElement('div'); d.textContent = '⚠︎ ' + m; d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:99999;background:#7a1f1f;color:#fff;font:13px/1.35 -apple-system,sans-serif;padding:8px 10px;border-radius:10px;pointer-events:none'; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 9000); } catch (_) {}
});
</script>
